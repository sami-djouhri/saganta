[project]
name = "saganta-shell-api"
version = "0.1.0"
description = "Saganta Shell-API: User-Settings, App-Registry, Audit-Log."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.137",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"
