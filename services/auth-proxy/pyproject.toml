[project]
name = "saganta-auth-proxy"
version = "0.1.0"
description = "Validiert Saganta-JWTs und proxied an life-ops-api mit Backend-Token."
requires-python = ">=3.12"
dependencies = [
  "prometheus-fastapi-instrumentator>=7.0,<8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"
