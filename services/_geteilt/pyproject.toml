[project]
name = "saganta-dienst"
version = "0.1.0"
description = "Bausteine, die alle Saganta-Backends teilen: JWT-Pruefung am Dienst-Eingang und das Entrauschen des Zugriffsprotokolls."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.137",
  "pydantic>=2.9",
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saganta_dienst*"]

[tool.ruff]
line-length = 100
target-version = "py312"
