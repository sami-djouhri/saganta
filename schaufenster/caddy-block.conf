# Der Block fuer saganta.de, zum Einfuegen in /etc/caddy/Caddyfile auf netcup.
#
# NICHT vor dem DNS einfuegen. Caddy holt beim Laden ein Zertifikat ueber eine
# HTTP-Challenge; zeigt saganta.de zu diesem Zeitpunkt noch nicht hierher,
# scheitert sie wiederholt und Let's Encrypt begrenzt die Versuche. Reihenfolge
# und Begruendung stehen in README.md.

www.saganta.de {
	redir https://saganta.de{uri} permanent
}

saganta.de {
	import sectxt

	encode zstd gzip

	# Origin-Lockdown, gleiches Muster wie djouhri.de: nur das Cloudflare-Netz
	# erreicht diese Maschine, der direkte Aufruf der netcup-IP bekommt 403.
	# Ausgenommen bleiben die netcup-internen Monitore (Gatus im Docker-Netz)
	# und die ACME-Challenge, damit die Zertifikatserneuerung nie bricht.
	#
	# ⚠️ ZWEI Abhaengigkeiten, die beide still zuschlagen:
	# 1. Der Block setzt voraus, dass saganta.de bei Cloudflare PROXIED steht
	#    (orange). Bei DNS-only antwortet die Seite jedem mit 403, und das sieht
	#    wie ein kaputter Server aus. Dann diesen Abschnitt entfernen.
	# 2. Die IP-Liste ist der Stand vom 2026-07-31 und steht hier ein zweites
	#    Mal, weil djouhri.de sie inline fuehrt. Veraltet sie, sperrt sie ab
	#    jetzt ZWEI Seiten aus statt einer. Quelle: cloudflare.com/ips
	@not_cf {
		not remote_ip 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32 127.0.0.1/8 ::1 172.16.0.0/12 10.0.0.0/8 192.0.2.10/16
		not path /.well-known/acme-challenge/*
	}
	respond @not_cf 403

	# Statisch, kein reverse_proxy und kein Container. Das ist der Unterschied
	# zu djouhri.de daneben: dort laeuft Next.js auf 8210, hier liegen fuenf
	# Dateien auf der Platte.
	root * /var/www/saganta
	file_server

	# Die Schriften tragen einen Inhaltsstempel im Namen nicht, deshalb nur eine
	# Woche statt eines Jahres. HTML bleibt kurz, damit eine Korrektur am
	# Impressum nicht tagelang in Caches haengt.
	@dauerhaft path /schrift/* /saganta.svg
	header @dauerhaft Cache-Control "public, max-age=604800"
	@html path / /*.html
	header @html Cache-Control "public, max-age=900"

	# Alles, was es hier nicht gibt, also auch die stillgelegten Pfade der Suite
	# (/login, /preise, die App-Pfade). Ein 404 ist die ehrliche Antwort; eine
	# Umleitung auf die Startseite wuerde einen Weg vortaeuschen.
	handle_errors {
		@vierhundertvier expression {err.status_code} == 404
		rewrite @vierhundertvier /404.html
		file_server
	}

	header {
		# Bewusst OHNE includeSubDomains, anders als bei djouhri.de. Die
		# Subdomains dieser Domain sind am 2026-10-21 stillgelegt worden; eine
		# Zusicherung ueber zwei Jahre fuer Namen, die niemand mehr bedient,
		# bringt nichts und verbaut den Weg, falls einer zurueckkommt.
		Strict-Transport-Security "max-age=63072000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		# Die Seite laedt nichts von fremden Hosts und hat kein JavaScript.
		# Genau das sagt datenschutz.html zu, und hier steht es als Regel statt
		# als Absicht: ein spaeter eingefuegtes Skript oder eine fremde Schrift
		# wuerde im Browser blockiert, nicht stillschweigend geladen.
		Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
		-Server
	}
}
