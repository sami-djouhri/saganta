  <path
    d="M 69 27 A 19 19 0 1 0 50 46 A 19 19 0 1 1 31 73"
    fill="none"
    stroke="#dd9c3f"
    stroke-width="12.5"
    stroke-linecap="round"
  />
  <circle cx="69" cy="27" r="6" fill="#dd9c3f" />
  <circle cx="31" cy="73" r="6" fill="#dd9c3f" />
</svg>
