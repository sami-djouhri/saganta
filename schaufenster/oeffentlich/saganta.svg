<!--
  Das Saganta-Zeichen, uebernommen aus `apps/shell/src/lib/Landing.svelte`.
  Dort stehen die Punkte in `currentColor`, weil sie im Fliesstext liegen. Als
  eigenstaendige Datei gibt es kein `currentColor`, das etwas erben koennte:
  ein Favicon wird ohne umgebenden Text geladen, der Wert faellt auf Schwarz
  zurueck und die Punkte verschwinden im dunklen Browser-Tab. Deshalb hier
  durchgehend der Markenton, der auf hellem und dunklem Grund traegt.
-->
