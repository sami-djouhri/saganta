<!doctype html>
<html lang="de" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <!-- Zwei Zeilen, weil die Adressleiste des Handys sonst im hellen Modus
         schwarz bleibt und die Seite oben abgeschnitten wirkt. Die Werte sind
         --dunkel-surface und --hell-surface aus dem Token-Paket. -->
    <meta name="theme-color" content="#161310" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <title>Saganta</title>
    %sveltekit.head%
  </head>
  <body>
    <div id="saganta-root">%sveltekit.body%</div>
  </body>
</html>
